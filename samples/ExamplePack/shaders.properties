# 着色器包可调参数声明（OptiFine / Iris 风格子集）。没有这个文件包也能加载，只是没有可调参数。
# 选项名就是编译宏名（等编译链路接上后，用 -d NAME=值 注入着色器编译）。

# 布尔开关：取值留空，默认关（宏不定义）
option.VOLUMETRIC_CLOUDS =

# 整数 / 浮点滑块：min max default
option.SKY_AMBIENT_INTENSITY = 0.0 8.0 4.0
option.CLOUD_VOLUME_MAX_STEP_COUNTS = 64 512 200

# 枚举：默认取第一个
option.CLOUD_QUALITY = low medium high

# 界面层级与展示顺序（可选）
screen = MAIN
screen.MAIN = ATMOSPHERE CLOUDS
screen.MAIN.ATMOSPHERE = SKY_AMBIENT_INTENSITY
screen.MAIN.CLOUDS = VOLUMETRIC_CLOUDS CLOUD_QUALITY CLOUD_VOLUME_MAX_STEP_COUNTS

# 旧写法也兼容：sliders = NAME1 NAME2 / 直接 NAME = ...
